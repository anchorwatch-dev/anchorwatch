name: routine-growth
on:
  workflow_dispatch:   # fallback only; the cloud routines run the schedule. Re-add a cron here if they ever stop.
permissions: { contents: write, pull-requests: write, issues: write }
concurrency: routine-growth
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get install -y -qq jq >/dev/null
      - run: bash scripts/run-routine.sh growth claude-opus-5 100
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.PRO_REPO_TOKEN || secrets.GITHUB_TOKEN }}
