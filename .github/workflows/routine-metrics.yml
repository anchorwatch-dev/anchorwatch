name: routine-metrics
on:
  schedule: [{ cron: "30 7 * * 1" }]
  workflow_dispatch:
permissions: { contents: write, pull-requests: write, issues: write }
concurrency: routine-metrics
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get install -y -qq jq >/dev/null
      - run: bash scripts/run-routine.sh metrics claude-sonnet-5 60
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.PRO_REPO_TOKEN || secrets.GITHUB_TOKEN }}
